# Catálogo canônico dos produtos monitorados.
#
# - "aliases": termos/variações de título que as lojas costumam usar para
#   anunciar este mesmo produto. Usados para dar match no matching de busca.
# - "excluded_models": códigos/termos de produtos PARECIDOS mas DIFERENTES,
#   que não podem ser confundidos com este item. Um coletor nunca deve
#   registrar um preço para um anúncio que bata com um destes.
# - "identity_confidence": confiança da identificação feita na pesquisa
#   inicial (alta / media / baixa). Itens com confiança baixa/media pedem
#   checagem redobrada de EAN/SKU antes de confiar num alerta.
# - "target_price": preço-alvo definido pelo usuário. null = não definido
#   ainda; quando definido, atingir esse preço ou menos gera alerta
#   imediato independente do Offer Score.

