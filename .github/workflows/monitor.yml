name: Monitor de Preços (execução periódica)

on:
  schedule:
    - cron: "0 */4 * * *"  # a cada 4 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar preços
        run: python -m price_monitor.collectors.collect_prices

      - name: Analisar ofertas e enviar alertas via WhatsApp
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m price_monitor.analysis.generate_alerts

      - name: Commitar banco atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_monitor/data/monitor.db
          git diff --cached --quiet && echo "Sem mudanças no banco." || git commit -m "Execução periódica: atualiza preços e alertas [skip ci]"
          git push
